[project]
name = "life-metric"
version = "0.1.0"
description = "Read the LIFE extinction-risk layers (Eyres et al. 2025) from a Zarr v3 store, with the colour scales to draw them"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Anil Madhavapeddy", email = "anil@recoil.org" },
    { name = "Michael Dales", email = "mwd24@cam.ac.uk" },
]
maintainers = [{ name = "Anil Madhavapeddy", email = "anil@recoil.org" }]
keywords = ["biodiversity", "extinction", "zarr", "raster", "LIFE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "fsspec>=2024.1",
    "numpy>=1.26",
    "requests>=2.31",
    "rich>=13.7",
    "rich-argparse>=1.5",
    "zarr>=3.1",
]

[project.optional-dependencies]
xarray = ["xarray>=2024.1"]
build = ["rasterio>=1.4"]
docs = ["sphinx>=8,<10", "sphinx-rtd-theme>=3,<4"]

[project.scripts]
life-metric = "life_metric.cli:main"

[project.urls]
Homepage = "https://source.coop/tessera/life"
Repository = "https://github.com/quantifyearth/LIFE.py"
Issues = "https://github.com/quantifyearth/LIFE.py/issues"
Pipeline = "https://github.com/quantifyearth/LIFE"
Data = "https://zenodo.org/records/14945383"
Paper = "https://doi.org/10.1098/rstb.2023.0327"

[dependency-groups]
dev = ["pytest>=8", "xarray>=2024.1", "rasterio>=1.4", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_metric"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*", "rasterio", "rasterio.*"]
ignore_missing_imports = true
